services:
  cloudops-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudops-delivery-guard:local
    ports:
      - "${WEB_PORT:-8080}:5000"
    environment:
      APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
