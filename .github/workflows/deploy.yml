name: Deploy to EC2 through SSM

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          for name in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: $name" >&2
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: CloudOpsDeploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build and publish the release image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy through Systems Manager Run Command
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          python - <<'PY'
          import json
          import os

          registry = os.environ["REGISTRY"]
          region = os.environ["AWS_REGION"]
          image_uri = os.environ["IMAGE_URI"]
          commands = [
              "set -eu",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {registry}",
              f"docker pull {image_uri}",
              "docker rm --force cloudops-demo || true",
              f"docker run --detach --name cloudops-demo --restart unless-stopped --publish 80:5000 --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges --env APP_VERSION={image_uri.rsplit(':', 1)[-1]} {image_uri}",
          ]
          with open("/tmp/ssm-commands.json", "w", encoding="utf-8") as stream:
              json.dump({"commands": commands}, stream)
          PY

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
